{% extends "layouts/dashboard.html" %}
{% block dashboard_content %}
<a href="{{ url_for('dashboard.card_view', id=client.id) }}" style="font-size:13px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:6px; margin-bottom:16px; text-decoration:none;">
  &larr; Back to Card
</a>

<div style="margin-bottom:24px;">
  <h1 style="font-size:22px; font-weight:500; color:var(--text-primary); margin:0 0 4px;">Order Prints</h1>
  <p style="font-size:14px; color:var(--text-secondary); margin:0;">{{ client.brand_name }}</p>
</div>

<form method="POST" action="{{ url_for('checkout.order', id=client.id) }}" style="max-width:640px;">
  <div style="margin-bottom:24px;">
    <div style="font-size:10px; font-weight:500; letter-spacing:0.08em; color:#888; margin-bottom:12px;">SELECT TIER</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      {% for key, tier in tiers.items() %}
      <label style="display:flex; align-items:center; justify-content:space-between; background:#1a1a1a; border:0.5px solid rgba(201,168,76,0.3); border-radius:10px; padding:14px 16px; cursor:pointer;">
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="radio" name="tier" value="{{ key }}" {% if key == 'standard' %}checked{% endif %} style="accent-color:#c9a84c;">
          <div>
            <div style="font-size:14px; font-weight:500; color:var(--text-primary);">{{ tier.label }}</div>
            <div style="font-size:12px; color:#555; margin-top:2px;">{{ tier.quantity }} cards printed &amp; delivered</div>
          </div>
        </div>
        <div style="font-size:18px; font-weight:600; color:#c9a84c;">{{ tier.display }}</div>
      </label>
      {% endfor %}
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <div style="font-size:10px; font-weight:500; letter-spacing:0.08em; color:#888; margin-bottom:12px;">DELIVERY ADDRESS</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="text" name="delivery_name" placeholder="Full name *" required
        style="background:#1a1a1a; border:0.5px solid rgba(201,168,76,0.3); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      <input type="text" name="delivery_line1" placeholder="Address line 1 *" required
        style="background:#1a1a1a; border:0.5px solid rgba(201,168,76,0.3); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      <input type="text" name="delivery_line2" placeholder="Address line 2 (optional)"
        style="background:#1a1a1a; border:0.5px solid rgba(201,168,76,0.3); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <input type="text" name="delivery_city" placeholder="City *" required
          style="background:#1a1a1a; border:0.5px solid rgba(201,168,76,0.3); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
        <input type="text" name="delivery_postcode" placeholder="Postcode *" required
          style="background:#1a1a1a; border:0.5px solid rgba(201,168,76,0.3); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      </div>
    </div>
  </div>

  <button type="submit" style="width:100%; padding:14px 0; background:#c9a84c; border:none; border-radius:10px; font-size:15px; font-weight:600; color:#1a1000; cursor:pointer; font-family:inherit;">
    <i class="ti ti-lock" aria-hidden="true"></i> Proceed to Payment
  </button>
  <p style="text-align:center; font-size:11px; color:#555; margin-top:10px;">Secured by Stripe. You will be redirected to complete payment.</p>
</form>

<style>
@media (max-width: 768px) {
  form { max-width: 100% !important; }
}
input::placeholder { color: #555; }
input:focus { outline: none; border-color: rgba(201,168,76,0.7) !important; }
</style>
{% endblock %}
