{% extends "layouts/dashboard.html" %}
{% block dashboard_content %}
<a href="{{ url_for('dashboard.card_view', id=client.id) }}" style="font-size:13px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:6px; margin-bottom:16px; text-decoration:none;">
  &larr; Back to Card
</a>

<div style="margin-bottom:24px;">
  <h1 style="font-size:22px; font-weight:400; color:var(--text-primary); margin:0 0 4px;">Order Prints</h1>
  <p style="font-size:14px; color:var(--text-secondary); margin:0;">{{ client.brand_name }}</p>
</div>

<form method="POST" action="{{ url_for('checkout.order', id=client.id) }}" style="max-width:640px;">
  <div style="margin-bottom:24px;">
    <div class="section-label" style="margin-bottom:12px;">SELECT TIER</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      {% for key, tier in tiers.items() %}
      <label class="tier-card" style="display:flex; align-items:center; gap:12px; background:var(--bg-elevated); border:1.5px solid rgba(107,31,42,0.2); border-radius:12px; padding:14px 16px; cursor:pointer; width:100%; box-sizing:border-box;">
        <input type="radio" name="tier" value="{{ key }}" {% if key == 'standard' %}checked{% endif %} style="accent-color:#6b1f2a; flex-shrink:0; width:18px; height:18px;">
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
            <span style="font-size:15px; font-weight:600; color:var(--text-primary);">{{ tier.label }}</span>
            <span style="font-size:17px; font-weight:700; color:#6b1f2a; flex-shrink:0;">{{ tier.display }}</span>
          </div>
          <div style="font-size:12px; color:var(--text-dim); margin-top:3px;">{{ tier.quantity }} cards printed &amp; delivered</div>
        </div>
      </label>
      {% endfor %}
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <div class="section-label" style="margin-bottom:12px;">DELIVERY ADDRESS</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="text" name="delivery_name" placeholder="Full name *" required
        style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      <input type="text" name="delivery_line1" placeholder="Address line 1 *" required
        style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      <input type="text" name="delivery_line2" placeholder="Address line 2 (optional)"
        style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <input type="text" name="delivery_city" placeholder="City *" required
          style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
        <input type="text" name="delivery_postcode" placeholder="Postcode *" required
          style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text-primary); font-size:14px; font-family:inherit; width:100%; box-sizing:border-box;">
      </div>
    </div>
  </div>

  <button type="submit" style="width:100%; padding:14px 0; background:#6b1f2a; border:none; border-radius:10px; font-size:15px; font-weight:600; color:#faf8f4; cursor:pointer; font-family:inherit;">
    <i class="ti ti-lock" aria-hidden="true"></i> Proceed to Payment
  </button>
  <p style="text-align:center; font-size:11px; color:var(--text-dim); margin-top:10px;">Secured by Stripe. You will be redirected to complete payment.</p>
</form>

<style>
@media (max-width: 768px) {
  form { max-width: 100% !important; }
}
input::placeholder { color: var(--text-dim); }
input:focus { outline: none; border-color: rgba(107,31,42,0.5) !important; }
.tier-card:has(input:checked) {
  border-color: rgba(107,31,42,0.7) !important;
  background: var(--bg-secondary) !important;
}
</style>
{% endblock %}
