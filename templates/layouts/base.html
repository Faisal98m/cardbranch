<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CardBranch{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #16161d;
            --bg-card: #1c1c26;
            --bg-elevated: #22222f;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-subtle: rgba(99, 102, 241, 0.1);
            --accent-border: rgba(99, 102, 241, 0.3);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-dim: #71717a;
            --border: #2a2a3a;
            --border-light: #323245;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 10px;
            --radius-sm: 6px;
            --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        a:hover { opacity: 0.85; }
        img { max-width: 100%; }
        input, textarea, select { font-family: 'Montserrat', sans-serif; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; width: 100%; outline: none; transition: border-color 0.15s; }
        input:focus, textarea:focus { border-color: var(--accent); }
        label { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        table { width: 100%; border-collapse: collapse; }
        th { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border); }
        td { padding: 12px 8px; font-size: 14px; color: var(--text-primary); border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .flash { padding: 12px 20px; margin-bottom: 16px; border-radius: var(--radius-sm); font-size: 14px; }
        .flash.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .flash.success { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 500; font-size: 14px; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Montserrat', sans-serif; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .btn-ghost-danger { background: transparent; border: 1px solid var(--border); color: var(--danger); }
        .btn-ghost-danger:hover { border-color: var(--danger); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; text-transform: capitalize; }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .status-sent_to_print { background: rgba(99, 102, 241, 0.1); color: var(--accent); }
        .status-dispatched { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .status-delivered { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        @media (max-width: 768px) {
            .container { padding: 0 16px !important; }
            main { padding-left: 16px !important; padding-right: 16px !important; }
        }
        .page-title { font-size: 24px; font-weight: 500; color: var(--text-primary); margin-bottom: 24px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
